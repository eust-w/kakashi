<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kakashi product overview</title>
  <desc id="desc">A product illustration showing GitHub repository search, Codex execution, verification, and export reports.</desc>
  <rect width="1280" height="640" rx="32" fill="#0F172A"/>
  <rect x="44" y="44" width="1192" height="552" rx="24" fill="#F8FAFC"/>
  <rect x="80" y="86" width="320" height="468" rx="18" fill="#FFFFFF" stroke="#D8DEE9"/>
  <rect x="432" y="86" width="768" height="468" rx="18" fill="#FFFFFF" stroke="#D8DEE9"/>
  <rect x="108" y="116" width="56" height="56" rx="12" fill="#111827"/>
  <text x="126" y="153" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">K</text>
  <text x="180" y="137" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Kakashi</text>
  <text x="180" y="162" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="15">Codex capability fusion</text>
  <rect x="108" y="210" width="248" height="96" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
