    <text x="500" y="282" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="14">real repos</text>
    <rect x="672" y="220" width="146" height="84" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="714" y="254" fill="#3730A3" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Graph</text>
    <text x="698" y="282" fill="#4F46E5" font-family="Inter, Arial, sans-serif" font-size="14">capabilities</text>
    <rect x="868" y="220" width="146" height="84" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="910" y="254" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Codex</text>
    <text x="896" y="282" fill="#C2410C" font-family="Inter, Arial, sans-serif" font-size="14">code changes</text>
    <path d="M622 262H672" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M818 262H868" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
