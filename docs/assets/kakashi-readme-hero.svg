  <text x="128" y="268" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Build a TypeScript dashboard</text>
  <text x="128" y="290" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">with GitHub search and tests</text>
  <rect x="108" y="334" width="116" height="52" rx="10" fill="#111827"/>
  <text x="138" y="366" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Auto</text>
  <rect x="240" y="334" width="116" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="270" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Interactive</text>
  <rect x="108" y="424" width="248" height="44" rx="10" fill="#2563EB"/>
  <text x="178" y="452" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Start run</text>
  <text x="472" y="134" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">Search, fuse, verify, export</text>
  <text x="472" y="166" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="16">A real execution loop for turning open-source capabilities into runnable projects.</text>
  <g>
    <rect x="476" y="220" width="146" height="84" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
